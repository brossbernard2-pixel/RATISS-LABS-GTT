name: GTT-CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install pytest
      - name: Install judge dependency (RATISS-Framework layer 1)
        run: pip install "ratiss-framework @ git+https://github.com/brossbernard2-pixel/RATISS-Framework.git"
      - name: Install GTT
        run: pip install -e .
      - name: Tests
        run: python -m pytest -q

  judge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install pytest
      - name: Install judge dependency (RATISS-Framework layer 1)
        run: pip install "ratiss-framework @ git+https://github.com/brossbernard2-pixel/RATISS-Framework.git"
      - name: Install GTT
        run: pip install -e .
      - name: Judge manifests
        run: python -m gtt.judge --ci