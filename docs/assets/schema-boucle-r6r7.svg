<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400"><rect width="760" height="400" fill="#0a1a22"/><text x="20" y="30" font-size="15" fill="#2dd4bf" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">La boucle scellée — aucune valeur sans reçu</text><circle cx="380" cy="210" r="120" fill="none" stroke="#2dd4bf" stroke-width="1.6" stroke-dasharray="6,4"/><path d="M 500 190 A 120 120 0 0 1 490 250" stroke="#2dd4bf" fill="none" stroke-width="2"/><text x="380" y="72" font-size="12.5" fill="#e6f7f5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">R6 : sceller les paramètres</text><text x="570" y="210" font-size="12.5" fill="#e6f7f5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">run mesuré</text><text x="380" y="356" font-size="12.5" fill="#e6f7f5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">R7 : reçu rejouable</text><text x="190" y="210" font-size="12.5" fill="#e6f7f5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">juge CI : re-scelle & compare</text><text x="380" y="204" font-size="13" fill="#2dd4bf" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">MANIFEST</text><text x="380" y="224" font-size="13" fill="#2dd4bf" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">→ SEALS.json</text><text x="380" y="244" font-size="10" fill="#8aa5ad" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">SHA-256 canonique</text><text x="20" y="380" font-size="10.5" fill="#8aa5ad" font-family="Segoe UI, Arial, sans-serif">altération après mesure = déviation journalisée (R5) · jamais silencieuse</text></svg>